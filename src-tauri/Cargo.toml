[package]
name = "webos-tv-guru"
version = "0.1.0"
description = "Sync and install .ipk apps on LG webOS TVs"
authors = ["vatichild"]
edition = "2021"

[lib]
name = "webos_tv_guru_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
ares-connection-lib = { git = "https://github.com/webosbrew/ares-cli-rs", tag = "v0.6.0" }
ares-device-lib = { git = "https://github.com/webosbrew/ares-cli-rs", tag = "v0.6.0" }
libssh-rs = "0.3.8"
thiserror = "2"
log = "0.4"
notify-debouncer-full = "0.6"
ar = "0.9"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
